<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor da Casa - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #4a332a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .login-box {
            background-color: #5d4232;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        h2 {
            font-family: 'Brush Script MT', cursive;
            font-size: 3em;
            margin-bottom: 20px;
            color: #f9e3c9;
        }
        h3 {
            color: #d1b490;
        }
        p {
            margin-bottom: 25px;
            color: #f0f0f0;
        }
        .btn-retorno {
            background-color: #d1b490;
            color: #4a332a;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-retorno:hover {
            background-color: #bfa180;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Sabor da Casa</h2>
        <h3>Sessão Encerrada</h3>
        <p>Obrigado por utilizar nosso livro de receitas. Faça o login novamente para continuar.</p>
        <button class="btn-retorno" onclick="window.location.href='index.html'">Entrar</button>
    </div>
</body>
</html>
